// proto/request.proto

/*
the request body structured protobuf config for the forward request
 */

syntax = "proto3";

package forwardRequest;

option go_package = "github.com/prdai/cf-region-proxy/test";

enum RequestMethod {
	GET = 0;
	POST = 1;
	PUT = 2;
	PATCH = 3;
	DELETE = 4;
}

message Headers {
	string key = 1;
	string value = 2;
}

message Request {
	string url = 1;
	RequestMethod method = 2;
	repeated Headers headers = 3;
	optional bytes body = 4;
}
